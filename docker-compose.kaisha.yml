services:
  elasticsearch:
    pull_policy: missing

  postgres:
    pull_policy: missing

  onlyoffice:
    pull_policy: missing

  keycloak-postgres:
    pull_policy: missing

  app:
    environment:
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_KEYCLOAK_URL}

  oauth2-proxy:
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:-mam}
      OAUTH2_PROXY_LOGIN_URL: ${PUBLIC_KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:-mam}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_MAM_URL}/oauth2/callback
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-mam}/protocol/openid-connect/logout?id_token_hint={id_token}&post_logout_redirect_uri=${PUBLIC_MAM_URL_ENCODED}%2Flogged-out
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_PROXY_WHITELIST_DOMAINS:-.company.local}

  keycloak:
    pull_policy: missing
    environment:
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

volumes:
  pg_data:
    external: false
    name: mam_kaisha_pg_data
  keycloak_pg_data:
    external: false
    name: mam_kaisha_keycloak_pg_data
