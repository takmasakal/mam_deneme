<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetMAM</title>
    <link rel="stylesheet" href="/styles.css?v=20260731-advanced-constraints-6" />
  </head>
  <body>
    <main class="layout">
      <section class="panel" id="panelIngest">
        <div class="top-row">
          <h1 class="app-brand" aria-label="MetMAM"><span>Met</span><span>MAM</span></h1>
          <div class="top-controls">
            <div class="user-box">
              <span class="user-box-label" data-i18n="current_user">Current User</span>
              <button type="button" id="currentUserBtn" class="current-user-btn">-</button>
              <div id="userMenu" class="user-menu hidden">
                <div class="user-menu-actions">
                  <a id="adminMenuLink" class="admin-link hidden" href="/admin.html" data-i18n="admin_page">Admin</a>
                  <button type="button" id="logoutBtn" class="logout-btn" data-i18n="logout">Logout</button>
                </div>
              </div>
            </div>
            <label class="lang-box">
              <span class="lang-box-label" data-i18n="language_label">Language</span>
              <span class="lang-box-select-wrap">
                <select id="languageSelect">
                  <option value="en">English</option>
                  <option value="tr">Türkçe</option>
                </select>
              </span>
            </label>
          </div>
        </div>

        <div class="ingest-panel-card">
          <form id="searchForm" class="stack search">
            <div class="search-title-row">
              <h2 data-i18n="search_title">Search</h2>
              <button type="button" id="advancedSearchBtn" class="asset-view-btn advanced-search-btn hidden" data-i18n-title="advanced_search" data-i18n-aria="advanced_search" title="Advanced search" aria-label="Advanced search">⚙</button>
              <div id="searchResultCounter" class="search-result-counter hidden" aria-live="polite"></div>
              <button type="button" id="clearSearchBtn" class="search-clear-btn" data-i18n="clear" data-i18n-title="clear_search_fields" data-i18n-aria="clear_search_fields" title="Clear search fields" aria-label="Clear search fields">Clear</button>
            </div>
            <div class="search-query-wrap">
              <input id="searchQueryInput" name="q" autocomplete="off" data-i18n-placeholder="ph_query" placeholder="Query" />
              <div id="searchSuggestList" class="search-suggest hidden"></div>
            </div>
            <div class="search-query-wrap">
              <input id="ocrQueryInput" name="ocrQ" autocomplete="off" data-i18n-placeholder="ph_ocr_query" placeholder="OCR Search" />
              <div id="ocrSuggestList" class="search-suggest hidden"></div>
            </div>
            <div class="search-query-wrap">
              <input id="subtitleQueryInput" name="subtitleQ" autocomplete="off" data-i18n-placeholder="ph_subtitle_query" placeholder="Subtitle Search" />
              <div id="subtitleSuggestList" class="search-suggest hidden"></div>
            </div>
            <input name="tag" data-i18n-placeholder="ph_tag" placeholder="Tag" />
            <input name="type" data-i18n-placeholder="ph_type_simple" placeholder="Type" />
            <input type="hidden" name="advancedSearch" value="" />
            <input type="hidden" name="uploadDateFrom" value="" />
            <input type="hidden" name="uploadDateTo" value="" />
            <input type="hidden" name="dateField" value="created" />
            <input type="hidden" name="sortBy" value="" />
            <select name="status">
              <option value="" data-i18n="any_status">Any status</option>
            </select>
            <select name="trash">
              <option value="active" data-i18n="trash_active">Active assets</option>
              <option value="trash" data-i18n="trash_only">Trash only</option>
              <option value="all" data-i18n="trash_all">All (active + trash)</option>
            </select>
            <div class="search-actions-row">
              <button type="submit" data-i18n="btn_apply_filters">Apply Filters</button>
            </div>
          </form>
        </div>

        <div id="advancedSearchModal" class="advanced-search-modal hidden" role="dialog" aria-modal="true" aria-labelledby="advancedSearchTitle">
          <div class="advanced-search-dialog">
            <div class="advanced-search-dialog-head">
              <div class="advanced-search-title-wrap">
                <h3 id="advancedSearchTitle" data-i18n="advanced_search">Advanced search</h3>
                <button type="button" id="advancedSearchHelpBtn" class="advanced-search-help-btn" aria-expanded="false" aria-controls="advancedSearchHelpText" title="Help">?</button>
                <span id="advancedSearchHelpText" class="advanced-search-help hidden" data-i18n="advanced_search_help">Drag fields into AND or OR.</span>
              </div>
              <button type="button" id="advancedSearchCloseBtn" class="advanced-search-close" aria-label="Close">×</button>
            </div>
            <div class="advanced-search-fields" id="advancedSearchFields">
              <div class="advanced-search-constraint-sections">
                <div class="advanced-search-constraint advanced-search-type-row" id="advancedSearchTypeSection">
                  <strong data-i18n="advanced_type_filter">Asset type</strong>
                  <div id="advancedSearchTypeOptions" class="advanced-search-type-options advanced-search-type-options-horizontal"></div>
                </div>
                <details class="advanced-search-constraint" id="advancedSearchDateSection">
                  <summary data-i18n="advanced_date_filter">Date</summary>
                  <div class="advanced-search-date-row">
                    <label>
                      <span data-i18n="advanced_date_field">Date field</span>
                      <select name="dateField">
                        <option value="created" data-i18n="advanced_date_field_created">Upload date</option>
                        <option value="updated" data-i18n="advanced_date_field_updated">Last modified date</option>
                      </select>
                    </label>
                    <label>
                      <span data-i18n="advanced_upload_from">Upload date from</span>
                      <input type="hidden" name="uploadDateFrom" value="" />
                      <input type="text" data-date-input="uploadDateFrom" data-i18n-placeholder="ph_upload_date_from" placeholder="YYYY-MM-DD" autocomplete="off" inputmode="numeric" />
                    </label>
                    <label>
                      <span data-i18n="advanced_upload_to">Upload date to</span>
                      <input type="hidden" name="uploadDateTo" value="" />
                      <input type="text" data-date-input="uploadDateTo" data-i18n-placeholder="ph_upload_date_to" placeholder="YYYY-MM-DD" autocomplete="off" inputmode="numeric" />
                    </label>
                    <label class="advanced-search-today-toggle">
                      <input type="checkbox" id="advancedSearchToday" />
                      <span data-i18n="advanced_today">End date is today</span>
                    </label>
                    <fieldset class="advanced-search-date-order">
                      <legend data-i18n="advanced_date_order">Date order</legend>
                      <label>
                        <input type="radio" name="advancedSortOrder" value="created_asc" data-sort-field="date" data-sort-direction="asc" />
                        <span data-i18n="advanced_date_asc">Ascending</span>
                      </label>
                      <label>
                        <input type="radio" name="advancedSortOrder" value="created_desc" data-sort-field="date" data-sort-direction="desc" />
                        <span data-i18n="advanced_date_desc">Descending</span>
                      </label>
                    </fieldset>
                  </div>
                </details>
                <details class="advanced-search-constraint" id="advancedSearchRangeSection">
                  <summary data-i18n="advanced_range_filter">Duration and size</summary>
                  <div class="advanced-search-range-row">
                    <fieldset class="advanced-search-duration-group">
                      <legend data-i18n="advanced_duration_min">Minimum duration</legend>
                      <div class="advanced-search-duration-inputs">
                        <label><span data-i18n="advanced_duration_hours">Hours</span><input type="number" data-duration-bound="min" data-duration-unit="hours" min="0" step="1" inputmode="numeric" /></label>
                        <label><span data-i18n="advanced_duration_minutes">Minutes</span><input type="number" data-duration-bound="min" data-duration-unit="minutes" min="0" max="59" step="1" inputmode="numeric" /></label>
                        <label><span data-i18n="advanced_duration_seconds">Seconds</span><input type="number" data-duration-bound="min" data-duration-unit="seconds" min="0" max="59" step="1" inputmode="numeric" /></label>
                      </div>
                    </fieldset>
                    <fieldset class="advanced-search-duration-group">
                      <legend data-i18n="advanced_duration_max">Maximum duration</legend>
                      <div class="advanced-search-duration-inputs">
                        <label><span data-i18n="advanced_duration_hours">Hours</span><input type="number" data-duration-bound="max" data-duration-unit="hours" min="0" step="1" inputmode="numeric" /></label>
                        <label><span data-i18n="advanced_duration_minutes">Minutes</span><input type="number" data-duration-bound="max" data-duration-unit="minutes" min="0" max="59" step="1" inputmode="numeric" /></label>
                        <label><span data-i18n="advanced_duration_seconds">Seconds</span><input type="number" data-duration-bound="max" data-duration-unit="seconds" min="0" max="59" step="1" inputmode="numeric" /></label>
                      </div>
                    </fieldset>
                    <label>
                      <span data-i18n="advanced_size_min">Minimum size</span>
                      <div class="advanced-search-size-input">
                        <input type="number" data-size-bound="min" data-size-value min="0" step="0.1" inputmode="decimal" />
                        <select data-size-bound="min" data-size-unit aria-label="Minimum size unit">
                          <option value="kb">KB</option><option value="mb" selected>MB</option><option value="gb">GB</option>
                        </select>
                      </div>
                    </label>
                    <label>
                      <span data-i18n="advanced_size_max">Maximum size</span>
                      <div class="advanced-search-size-input">
                        <input type="number" data-size-bound="max" data-size-value min="0" step="0.1" inputmode="decimal" />
                        <select data-size-bound="max" data-size-unit aria-label="Maximum size unit">
                          <option value="kb">KB</option><option value="mb" selected>MB</option><option value="gb">GB</option>
                        </select>
                      </div>
                    </label>
                  </div>
                  <div class="advanced-search-range-order-row">
                    <fieldset class="advanced-search-range-order">
                      <legend data-i18n="advanced_duration_order">Duration order</legend>
                      <label><input type="radio" name="advancedSortOrder" value="duration_asc" data-sort-field="duration" /><span data-i18n="advanced_date_asc">Ascending</span></label>
                      <label><input type="radio" name="advancedSortOrder" value="duration_desc" data-sort-field="duration" /><span data-i18n="advanced_date_desc">Descending</span></label>
                    </fieldset>
                    <fieldset class="advanced-search-range-order">
                      <legend data-i18n="advanced_size_order">Size order</legend>
                      <label><input type="radio" name="advancedSortOrder" value="size_asc" data-sort-field="size" /><span data-i18n="advanced_date_asc">Ascending</span></label>
                      <label><input type="radio" name="advancedSortOrder" value="size_desc" data-sort-field="size" /><span data-i18n="advanced_date_desc">Descending</span></label>
                    </fieldset>
                  </div>
                </details>
              </div>
              <div class="advanced-search-available-fields" id="advancedSearchAvailableFields"></div>
            </div>
            <div class="advanced-search-groups">
              <section class="advanced-search-group advanced-search-and" data-advanced-group="and">
                <h4 data-i18n="advanced_and">AND</h4>
                <div class="advanced-search-dropzone" data-advanced-drop="and"></div>
              </section>
              <section class="advanced-search-group advanced-search-or" data-advanced-group="or">
                <h4 data-i18n="advanced_or">OR</h4>
                <div class="advanced-search-dropzone" data-advanced-drop="or"></div>
              </section>
            </div>
            <div class="advanced-search-controls">
              <div class="advanced-search-saved-row">
                <select id="advancedSearchSaved" aria-label="Saved searches">
                  <option value="" data-i18n="advanced_saved_searches">Saved searches</option>
                </select>
                <button type="button" id="advancedSearchLoadBtn" data-i18n="advanced_load">Load</button>
                <button type="button" id="advancedSearchSaveBtn" data-i18n="advanced_save">Save</button>
                <button type="button" id="advancedSearchDeleteBtn" data-i18n="advanced_delete" disabled>Delete</button>
              </div>
              <div class="advanced-search-actions">
                <button type="button" id="advancedSearchClearBtn" data-i18n="clear">Clear</button>
                <button type="button" id="advancedSearchApplyBtn" data-i18n="btn_apply_filters">Apply Filters</button>
              </div>
            </div>
          </div>
        </div>

        <div class="ingest-panel-card">
          <form id="ingestForm" class="stack">
            <div class="ingest-title-row">
              <h2 data-i18n="ingest_title">Ingest Asset</h2>
              <label id="metadataGenerateToggle" class="metadata-generate-toggle">
                <input name="generateMetadata" type="checkbox" />
                <span data-i18n="generate_metadata">Generate metadata</span>
              </label>
            </div>
            <input name="title" data-i18n-placeholder="ph_title" placeholder="Title" required />
            <select name="type" required>
              <option value="Video" data-i18n="type_video">Video</option>
              <option value="Audio" data-i18n="type_audio">Audio</option>
              <option value="Document" data-i18n="type_document">Document</option>
              <option value="Photo" data-i18n="type_photo">Photo</option>
              <option value="Other" data-i18n="type_other">Other</option>
            </select>
            <div class="file-picker">
              <input id="mediaFileInput" name="mediaFile" type="file" class="file-picker-input" accept="video/*,audio/*,image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.rtf,.csv,.sql,.py,.js,.ts,.tsx,.jsx,.json,.md,.xml,.yaml,.yml,.log,.ini,.cfg,.conf,.sh,.bash,.zsh,.java,.c,.cpp,.h,.hpp,.go,.rs,.rb,.php,.swift,.kt" />
              <label for="mediaFileInput" id="mediaFileBtn" class="file-picker-btn" data-i18n="choose_file">Dosya Seç</label>
              <span id="mediaFileName" class="file-picker-name"></span>
            </div>
            <input name="tags" data-i18n-placeholder="ph_tags" placeholder="Tags (comma separated)" />
            <textarea name="description" data-i18n-placeholder="ph_description" placeholder="Description"></textarea>
            <button type="submit" data-i18n="btn_upload_create">Upload & Create Asset</button>
            <div id="uploadProgressWrap" class="upload-progress hidden" aria-live="polite">
              <span id="uploadProgressSpinner" class="spinner upload-progress-spinner" aria-hidden="true"></span>
              <div id="uploadProgressText" class="upload-progress-text">0%</div>
            </div>
          </form>
        </div>
      </section>

      <div class="panel-splitter" data-splitter="left" title="Drag to resize panels">
        <button type="button" class="splitter-dot" data-hide-panel="panelIngest" aria-label="Hide search panel"></button>
        <button type="button" class="splitter-tab splitter-tab-search" data-show-panel="panelIngest" data-i18n="search_upload_tag">SEARCH / UPLOAD</button>
      </div>

      <section class="panel" id="panelAssets">
        <div class="panel-head">
          <h2 data-i18n="assets_title">Assets</h2>
          <div class="asset-head-filters">
            <label><input type="checkbox" class="asset-type-filter" value="video" checked /> <span data-i18n="type_video">Video</span></label>
            <label><input type="checkbox" class="asset-type-filter" value="audio" checked /> <span data-i18n="type_audio">Audio</span></label>
            <label><input type="checkbox" class="asset-type-filter" value="document" checked /> <span data-i18n="type_document">Document</span></label>
            <label><input type="checkbox" class="asset-type-filter" value="photo" checked /> <span data-i18n="type_photo">Photo</span></label>
            <label><input type="checkbox" class="asset-type-filter" value="other" checked /> <span data-i18n="type_other">Other</span></label>
          </div>
          <div class="asset-view-switch" role="group" aria-label="Asset view mode">
            <button type="button" id="assetViewThumbBtn" class="asset-view-btn asset-view-btn-thumb" aria-label="Thumbnail view" title="Thumbnail view"></button>
            <button type="button" id="assetViewListBtn" class="asset-view-btn asset-view-btn-list" aria-label="List view" title="List view"></button>
          </div>
        </div>
        <div id="assetGrid" class="asset-grid"></div>
      </section>

      <div class="panel-splitter" data-splitter="right" title="Drag to resize panels">
        <button type="button" class="splitter-dot" data-hide-panel="panelAssets" aria-label="Hide assets panel"></button>
        <button type="button" class="splitter-tab splitter-tab-assets" data-show-panel="panelAssets" data-i18n="assets_title">Assets</button>
      </div>

      <section class="panel" id="panelDetail">
        <div class="panel-head">
          <h2 data-i18n="asset_detail_title">Detail</h2>
          <div id="panelDetailTcSlot" class="detail-panel-tc-slot hidden" aria-live="polite"></div>
          <div class="panel-head-actions">
            <button id="panelVideoToolsBtn" class="panel-icon-btn hidden" type="button" aria-label="Video Tools" title="Video Tools">⚙</button>
            <button id="closeDetailBtn" class="close-detail-btn" type="button" aria-label="Close detail panel">×</button>
          </div>
        </div>
        <div id="assetDetail" class="empty" data-i18n="select_asset">Select an asset.</div>
      </section>
    </main>

    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="/session-expiry.js?v=20260714-session-expiry-3"></script>
    <script src="/main-workflow-store.js?v=20260729-workflow-store-1"></script>
    <script src="/main-technical-info-store.js?v=20260729-technical-info-store-1"></script>
    <script src="/main-search-suggest.js?v=20260424-main-refactor-1"></script>
    <script src="/main-assets.js?v=20260727-date-field-1"></script>
    <script src="/main-asset-card.js?v=20260731-search-card-metric-labels-1"></script>
    <script src="/main-asset-grid-events.js?v=20260728-grid-events-1"></script>
    <script src="/main-asset-browser.js?v=20260728-grid-events-1"></script>
    <script src="/main-shell.js?v=20260722-volume-controls-1"></script>
    <script src="/main-dialogs.js?v=20260424-main-refactor-9"></script>
    <script src="/main-detail.js?v=20260731-detail-duration-size-1"></script>
    <script src="/main-detail-version-actions.js?v=20260729-version-actions-1"></script>
    <script src="/main-detail-asset-actions.js?v=20260729-asset-actions-1"></script>
    <script src="/main-detail-request-coordinator.js?v=20260729-detail-request-1"></script>
    <script src="/main-common.js?v=20260424-main-refactor-13"></script>
    <script src="/main-ingest.js?v=20260804-fileless-assets-1"></script>
    <script src="/main-document-preview.js?v=20260424-main-refactor-7"></script>
    <script src="/main-media-viewer.js?v=20260629-photo-ocr-1"></script>
    <script src="/main-player-ui.js?v=20260722-volume-controls-1"></script>
    <script src="/main-player-runtime.js?v=20260424-main-refactor-12"></script>
    <script src="/main-video-tools.js?v=20260424-main-refactor-6"></script>
    <script src="/main-player-bootstrap.js?v=20260424-main-refactor-4"></script>
    <script src="/main-access-scope.js?v=20260701-upload-scope-1"></script>
    <script src="/main-advanced-search.js?v=20260731-advanced-constraints-4"></script>
    <script src="/main-bootstrap.js?v=20260728-bootstrap-1"></script>
    <script src="/main.js?v=20260728-bootstrap-1"></script>
  </body>
</html>
