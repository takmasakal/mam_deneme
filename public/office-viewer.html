<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAM Document Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121722;
      --panel: #1a2231;
      --line: #334158;
      --text: #eef3ff;
      --muted: #a9b4ca;
      --accent: #3dc48d;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      overflow: hidden;
    }
    #officeEditor {
      height: 100vh;
      width: 100%;
    }
    .readonly-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      max-width: min(720px, calc(100% - 32px));
      padding: 7px 12px;
      border: 1px solid rgba(235, 94, 40, 0.55);
      border-radius: 8px;
      background: rgba(26, 34, 49, 0.94);
      color: #ffd7c6;
      font-size: 12px;
      line-height: 1.35;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }
    .viewer-error {
      padding: 18px;
      margin: 18px;
      border: 1px solid rgba(214, 90, 90, 0.45);
      border-radius: 12px;
      background: rgba(105, 29, 29, 0.22);
      color: #ffdede;
      white-space: pre-wrap;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="officeEditor"></div>
  <div id="readOnlyBanner" class="readonly-banner hidden"></div>
  <div id="errorBox" class="viewer-error hidden"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const assetId = String(params.get('assetId') || '').trim();
    const lang = String(params.get('lang') || 'tr').trim().toLowerCase();
    const errorBox = document.getElementById('errorBox');
    const officeEditor = document.getElementById('officeEditor');
    const readOnlyBanner = document.getElementById('readOnlyBanner');
    let editLockActive = false;
    let editLockRefreshTimer = null;

    function showError(message) {
      if (errorBox) {
        errorBox.classList.remove('hidden');
        errorBox.textContent = String(message || 'Viewer failed');
      }
    }

    function showReadOnlyBanner(message) {
      if (!readOnlyBanner || !message) return;
      readOnlyBanner.classList.remove('hidden');
      readOnlyBanner.textContent = String(message);
    }

    function formatAssetLockedMessage(payload = {}) {
      const lock = payload?.conflictingEditLock && typeof payload.conflictingEditLock === 'object'
        ? payload.conflictingEditLock
        : (payload?.lock && typeof payload.lock === 'object' ? payload.lock : {});
      const lockName = String(lock.lockedByName || lock.lockedBy || '').trim();
      if (lockName) {
        return lang === 'tr'
          ? `${lockName} bu varlığı düzenliyor.`
          : `${lockName} is editing this asset.`;
      }
      return lang === 'tr'
        ? 'Bu varlık başka bir kullanıcı tarafından düzenleniyor.'
        : 'This asset is being edited by another user.';
    }

    function releaseEditLock() {
      if (!editLockActive || !assetId) return;
      editLockActive = false;
      if (editLockRefreshTimer) {
        clearInterval(editLockRefreshTimer);
        editLockRefreshTimer = null;
      }
      try {
        fetch(`/api/assets/${encodeURIComponent(assetId)}/edit-lock`, {
          method: 'DELETE',
          credentials: 'same-origin',
          keepalive: true
        }).catch(() => {});
      } catch (_error) {}
    }

    function startEditLockRefresh() {
      if (!assetId || editLockRefreshTimer) return;
      editLockActive = true;
      editLockRefreshTimer = setInterval(() => {
        fetch(`/api/assets/${encodeURIComponent(assetId)}/edit-lock/refresh`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ purpose: 'office' })
        }).catch(() => {});
      }, 60000);
    }

    window.addEventListener('beforeunload', releaseEditLock);

    async function boot() {
      if (!assetId) {
        showError('assetId eksik.');
        return;
      }
      try {
        const configRes = await fetch(`/api/assets/${encodeURIComponent(assetId)}/office-config?lang=${encodeURIComponent(lang)}`, {
          credentials: 'same-origin',
          cache: 'no-store'
        });
        const payload = await configRes.json().catch(() => ({}));
        if (!configRes.ok) {
          throw new Error(String(payload.code === 'asset_locked'
            ? formatAssetLockedMessage(payload)
            : (payload.error || 'ONLYOFFICE config could not be loaded.')));
        }
        showReadOnlyBanner(payload?.conflictingEditLock ? formatAssetLockedMessage(payload) : (payload?.readOnlyReason || ''));
        if (payload?.editLock) startEditLockRefresh();
        const script = document.createElement('script');
        script.src = `${String(payload.onlyofficeUrl || '').replace(/\/+$/, '')}/web-apps/apps/api/documents/api.js`;
        script.onload = () => {
          if (!window.DocsAPI || !window.DocsAPI.DocEditor) {
            showError('ONLYOFFICE DocsAPI yüklenemedi.');
            return;
          }
          window.docEditor = new window.DocsAPI.DocEditor('officeEditor', payload.config);
        };
        script.onerror = () => showError('ONLYOFFICE script yüklenemedi. Document Server çalışıyor mu kontrol edin.');
        document.head.appendChild(script);
      } catch (error) {
        showError(error && error.message ? error.message : 'Viewer failed');
      }
    }

    boot();
  </script>
</body>
</html>
