name: kaisha

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    pull_policy: never
    container_name: kaisha-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  postgres:
    image: postgres:16
    pull_policy: never
    container_name: kaisha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/mam_postgres_password
      POSTGRES_DB: mam_mvp
    secrets:
      - mam_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mam_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: kaisha-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-true}
        PRELOAD_ML_MODELS: ${PRELOAD_ML_MODELS:-true}
        PRELOAD_PADDLE_OCR: ${PRELOAD_PADDLE_OCR:-true}
        PRELOAD_MARIAN_TRANSLATION: ${PRELOAD_MARIAN_TRANSLATION:-false}
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
        HF_TOKEN: ${HF_TOKEN:-}
        MAM_GIT_COMMIT: ${MAM_GIT_COMMIT:-unknown}
        MAM_GIT_BRANCH: ${MAM_GIT_BRANCH:-unknown}
        MAM_BUILD_DATE: ${MAM_BUILD_DATE:-unknown}
    container_name: kaisha-app
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    environment:
      MAM_DB_HOST: postgres
      MAM_DB_PORT: 5432
      MAM_DB_USER: postgres
      MAM_DB_NAME: mam_mvp
      MAM_DB_PASSWORD_FILE: /run/secrets/mam_postgres_password
      KEYCLOAK_DB_HOST: keycloak-postgres
      KEYCLOAK_DB_PORT: 5432
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_INDEX: mam_assets
      PORT: 3000
      TZ: ${TZ:-Europe/Istanbul}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1500mb}
      MAM_OFFLINE_MODE: ${MAM_OFFLINE_MODE:-true}
      MAM_MODEL_CACHE_DIR: /opt/mam-models
      MAM_MARIAN_MODEL_DIR: /opt/mam-models/marian/opus-mt-tc-big-en-tr
      HF_HOME: /opt/mam-models/huggingface
      HF_HUB_CACHE: /opt/mam-models/huggingface/hub
      TRANSFORMERS_CACHE: /opt/mam-models/huggingface/transformers
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MODEL_CACHE: /opt/mam-models/huggingface
      PADDLE_PDX_CACHE_HOME: /opt/mam-models/paddle
      PADDLE_HOME: /opt/mam-models/paddle
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_OCR_ALLOW_FALLBACK: "false"
      MAM_GIT_COMMIT: ${MAM_GIT_COMMIT:-unknown}
      MAM_GIT_BRANCH: ${MAM_GIT_BRANCH:-unknown}
      MAM_BUILD_DATE: ${MAM_BUILD_DATE:-unknown}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: mam
      KEYCLOAK_REALMS: mam
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      MAM_API_TOKEN_USERNAME: ${MAM_API_TOKEN_USERNAME:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-mam-web}
      USE_OAUTH2_PROXY: "true"
      OFFICE_EDITOR_PROVIDER: ${OFFICE_EDITOR_PROVIDER:-onlyoffice}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8082}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      APP_INTERNAL_URL: http://app:3000
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    volumes:
      - ./uploads:/app/uploads
      - model_cache:/opt/mam-models
      - /home/belge/depo/netapp/belgelik:/home/belge/depo/netapp/belgelik
      - /home/belge/depo/netapp/belgelik-restic:/home/belge/depo/netapp/belgelik-restic
    secrets:
      - mam_postgres_password
      - keycloak_db_password
      - keycloak_admin_password
      - restic_password
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:8.3
    pull_policy: never
    container_name: kaisha-onlyoffice
    environment:
      JWT_ENABLED: "false"
    entrypoint:
      - /bin/bash
      - -lc
      - |
        python3 - <<'PY'
        import json
        path = '/etc/onlyoffice/documentserver/default.json'
        with open(path, 'r', encoding='utf-8') as fh:
          data = json.load(fh)
        services = data.setdefault('services', {}).setdefault('CoAuthoring', {})
        rfa = services.setdefault('request-filtering-agent', {})
        rfa['allowPrivateIPAddress'] = True
        rfa['allowMetaIPAddress'] = False
        ext = data.setdefault('externalRequest', {})
        ext.setdefault('action', {})['blockPrivateIP'] = False
        with open(path, 'w', encoding='utf-8') as fh:
          json.dump(data, fh, indent=2)
        PY
        for conf in /etc/onlyoffice/documentserver/nginx/includes/ds-common.conf /etc/nginx/includes/ds-common.conf; do
          if [ -f "$$conf" ] && ! grep -q 'large_client_header_buffers 8 64k' "$$conf"; then
            printf '\n# MAM: browser auth cookies can be large on the same localhost/IP origin.\nclient_header_buffer_size 32k;\nlarge_client_header_buffers 8 64k;\n' >> "$$conf"
          fi
        done
        exec /app/ds/run-document-server.sh
    ports:
      - "8082:80"
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16
    pull_policy: never
    container_name: kaisha-keycloak-postgres
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    pull_policy: never
    container_name: kaisha-keycloak
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      MAM_SUPERADMIN_USER: ${MAM_SUPERADMIN_USER:-mamsup}
      MAM_ADMIN_USER: ${MAM_ADMIN_USER:-mamadmin}
      MAM_USER: ${MAM_USER:-mamuser}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    entrypoint:
      - /bin/sh
      - /opt/keycloak/mam-keycloak-entrypoint.sh
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
      - --spi-theme-static-max-age=-1
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes
      - ./deploy/keycloak/mam-realm.template.json:/opt/keycloak/mam-realm.template.json:ro
      - ./deploy/keycloak-entrypoint.sh:/opt/keycloak/mam-keycloak-entrypoint.sh:ro
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - oauth2_proxy_client_secret
      - mam_superadmin_password
      - mam_admin_password
      - mam_user_password
    restart: unless-stopped

  oauth2-proxy:
    build:
      context: .
      dockerfile: Dockerfile.oauth2-proxy
    image: mam-oauth2-proxy:7.6.0-shell
    pull_policy: never
    container_name: kaisha-oauth2-proxy
    depends_on:
      app:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-http://localhost:8081/realms/mam}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      OAUTH2_PROXY_LOGIN_URL: ${OAUTH2_PROXY_LOGIN_URL:-http://localhost:8081/realms/mam/protocol/openid-connect/auth?ui_locales=tr}
      OAUTH2_PROXY_REDEEM_URL: ${OAUTH2_PROXY_REDEEM_URL:-http://keycloak:8080/realms/mam/protocol/openid-connect/token}
      OAUTH2_PROXY_OIDC_JWKS_URL: ${OAUTH2_PROXY_OIDC_JWKS_URL:-http://keycloak:8080/realms/mam/protocol/openid-connect/certs}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-mam-web}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://app:3000
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_EXPIRE: ${OAUTH2_PROXY_COOKIE_EXPIRE:-8h}
      OAUTH2_PROXY_COOKIE_REFRESH: ${OAUTH2_PROXY_COOKIE_REFRESH:-15m}
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: ${OAUTH2_PROXY_COOKIE_CSRF_EXPIRE:-1h}
      OAUTH2_PROXY_COOKIE_DOMAINS: ${OAUTH2_PROXY_COOKIE_DOMAINS:-}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_PROXY_WHITELIST_DOMAINS:-localhost,localhost:*}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-http://localhost:3000/oauth2/callback}
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: ${OAUTH2_PROXY_BACKEND_LOGOUT_URL:-http://keycloak:8080/realms/mam/protocol/openid-connect/logout?id_token_hint={id_token}&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Foauth2%2Fstart%3Frd%3D%252F}
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/api/.*"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "false"
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: ${OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES:-account,metmam-mobile,realm-management}
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "false"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 15m
    entrypoint:
      - /bin/sh
      - /opt/mam/oauth2-proxy-entrypoint.sh
    volumes:
      - ./deploy/oauth2-proxy-entrypoint.sh:/opt/mam/oauth2-proxy-entrypoint.sh:ro
    secrets:
      - oauth2_proxy_client_secret
      - oauth2_proxy_cookie_secret
    ports:
      - "3000:4180"
    restart: unless-stopped

secrets:
  mam_postgres_password:
    file: ./deploy/secrets/mam_postgres_password
  keycloak_db_password:
    file: ./deploy/secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./deploy/secrets/keycloak_admin_password
  restic_password:
    file: ./deploy/secrets/restic_password
  oauth2_proxy_client_secret:
    file: ./deploy/secrets/oauth2_proxy_client_secret
  oauth2_proxy_cookie_secret:
    file: ./deploy/secrets/oauth2_proxy_cookie_secret
  mam_superadmin_password:
    file: ./deploy/secrets/mam_superadmin_password
  mam_admin_password:
    file: ./deploy/secrets/mam_admin_password
  mam_user_password:
    file: ./deploy/secrets/mam_user_password

volumes:
  pg_data:
    external: true
    name: mam_kaisha_pg_data
  es_data:
    external: true
    name: mam_kaisha_es_data
  keycloak_pg_data:
    external: true
    name: mam_kaisha_keycloak_pg_data
  model_cache:
