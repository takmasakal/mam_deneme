<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Belgelik | Bakım</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #212223;
      color: #ffffff;
      font-family: "Baloo 2", "Arial Rounded MT Bold", Arial, sans-serif;
    }
    .maintenance { width: min(1200px, 96vw); text-align: center; }
    .visual-wrap {
      width: min(980px, 94vw);
      max-height: 62vh;
      margin: 0 auto 48px;
      border-radius: 28px;
      overflow: hidden;
      line-height: 0;
    }
    .visual {
      display: block;
      width: 100%;
      height: auto;
      max-height: 62vh;
      object-fit: cover;
      border-radius: 28px;
      clip-path: inset(0 round 28px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0f0ee;
    }
    h1::after {
      content: "";
      display: block;
      width: 54px;
      height: 3px;
      margin: 14px auto 0;
      border-radius: 999px;
      background: #e5ab32;
    }
    p {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
      font-weight: 400;
      color: #b8b5ae;
    }
    @media (max-width: 700px) {
      body { padding: 16px; }
      .visual-wrap { max-height: 52vh; margin-bottom: 34px; }
      .visual { max-height: 52vh; }
    }
  </style>
</head>
<body>
  <main class="maintenance">
    <div class="visual-wrap">
      <img class="visual" src="./belgelik-maintenance.png" alt="">
    </div>
    <h1>Sistem şu anda bakım altında</h1>
    <p>Belgelik üzerinde planlı güncelleme ve iyileştirme çalışmaları yapılmaktadır.</p>
  </main>
</body>
</html>
