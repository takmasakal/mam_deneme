# Belgelik maintenance support.
# Include this file once inside the `server { ... }` block for belgelik.trt.net.tr.
#
# Example:
#   server {
#     server_name belgelik.trt.net.tr;
#     include /etc/nginx/snippets/belgelik-maintenance-server.conf;
#     location / {
#       include /etc/nginx/snippets/belgelik-maintenance-location.conf;
#       proxy_pass http://127.0.0.1:3000;
#       ...
#     }
#   }

location = /__belgelik-maintenance/maintenance.html {
    internal;
    alias /var/www/belgelik-maintenance/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Retry-After "60" always;
}

location = /__belgelik-maintenance/belgelik-maintenance.png {
    alias /var/www/belgelik-maintenance/belgelik-maintenance.png;
    default_type image/png;
    add_header Cache-Control "public, max-age=3600" always;
}

error_page 503 /__belgelik-maintenance/maintenance.html;
