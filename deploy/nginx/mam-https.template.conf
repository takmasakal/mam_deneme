map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name __MAM_HOST__ __KEYCLOAK_HOST__ __OFFICE_HOST__;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name __MAM_HOST__;

  ssl_certificate /etc/nginx/certs/mam.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/mam.privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 20g;
  client_body_timeout 3600s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;
  proxy_buffering off;
  proxy_request_buffering off;

  location / {
    set $mam_upstream http://oauth2-proxy:4180;
    proxy_pass $mam_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __KEYCLOAK_HOST__;

  ssl_certificate /etc/nginx/certs/auth.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/auth.privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 100m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __OFFICE_HOST__;

  ssl_certificate /etc/nginx/certs/office.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/office.privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 20g;
  client_body_timeout 3600s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;
  proxy_buffering off;
  proxy_request_buffering off;

  location / {
    set $onlyoffice_upstream http://onlyoffice:80;
    proxy_pass $onlyoffice_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
