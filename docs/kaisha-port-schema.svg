<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Kaisha Port ve Reverse Proxy Semasi</title>
  <desc id="desc">Sirket reverse proxy katmani ile 10.0.6.200 Kaisha sunucusu arasindaki port yonlendirmeleri.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#0f172a}
      .bg{fill:#f8fafc}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:16px;fill:#475569}
      .groupTitle{font-size:20px;font-weight:700}
      .boxTitle{font-size:17px;font-weight:700}
      .txt{font-size:14px;fill:#334155}
      .small{font-size:12px;fill:#475569}
      .proxyGroup{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .serverGroup{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .noteGroup{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .user{fill:#fff;stroke:#64748b;stroke-width:2}
      .proxy{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .svc{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
      .db{fill:#fffbeb;stroke:#d97706;stroke-width:2}
      .line{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}
      .labelBg{fill:#f8fafc}
      .label{font-size:12px;font-weight:700;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="50" y="52">Kaisha Port ve Reverse Proxy Semasi</text>
  <text class="sub" x="50" y="80">Dis domainler sirket reverse proxy katmanindan 10.0.6.200 uzerindeki Kaisha servislerine yonlenir.</text>

  <rect class="proxyGroup" x="310" y="120" width="330" height="520" rx="12"/>
  <text class="groupTitle" x="335" y="155">Sirket Reverse Proxy / LB</text>
  <text class="small" x="335" y="180">HTTPS 443, host bazli routing</text>

  <rect class="serverGroup" x="720" y="120" width="625" height="520" rx="12"/>
  <text class="groupTitle" x="745" y="155">Kaisha Sunucusu: 10.0.6.200</text>
  <text class="small" x="745" y="180">Docker Compose servisleri ve ic ag</text>

  <rect class="user" x="45" y="330" width="205" height="100" rx="10"/>
  <text class="boxTitle" x="80" y="370">Kullanici</text>
  <text class="txt" x="80" y="398">Tarayici</text>

  <rect class="proxy" x="350" y="215" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="370" y="250">belgelik.sirketim.com</text>
  <text class="txt" x="370" y="276">HTTPS 443 - MAM</text>

  <rect class="proxy" x="350" y="355" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="370" y="390">authbelgelik.sirketim.com</text>
  <text class="txt" x="370" y="416">HTTPS 443 - Keycloak</text>

  <rect class="proxy" x="350" y="495" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="370" y="530">officebelgelik.sirketim.com</text>
  <text class="txt" x="370" y="556">HTTPS 443 - OnlyOffice</text>

  <rect class="svc" x="760" y="215" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="780" y="250">kaisha-oauth2-proxy</text>
  <text class="txt" x="780" y="276">Host 3000 -> Container 4180</text>

  <rect class="svc" x="1055" y="215" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="1075" y="250">kaisha-app</text>
  <text class="txt" x="1075" y="276">Container 3000</text>

  <rect class="svc" x="760" y="355" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="780" y="390">kaisha-keycloak</text>
  <text class="txt" x="780" y="416">Host 8081 -> Container 8080</text>

  <rect class="svc" x="760" y="495" width="250" height="92" rx="10"/>
  <text class="boxTitle" x="780" y="530">kaisha-onlyoffice</text>
  <text class="txt" x="780" y="556">Host 8082 -> Container 80</text>

  <rect class="db" x="1055" y="355" width="250" height="78" rx="10"/>
  <text class="boxTitle" x="1075" y="388">kaisha-postgres</text>
  <text class="txt" x="1075" y="414">Host 5432 -> Container 5432</text>

  <rect class="db" x="1055" y="465" width="250" height="78" rx="10"/>
  <text class="boxTitle" x="1075" y="498">keycloak-postgres</text>
  <text class="txt" x="1075" y="524">Container 5432</text>

  <rect class="db" x="1055" y="575" width="250" height="78" rx="10"/>
  <text class="boxTitle" x="1075" y="608">kaisha-elasticsearch</text>
  <text class="txt" x="1075" y="634">Host 9200 -> Container 9200</text>

  <path class="line" d="M250 350 C295 285 315 260 350 260"/>
  <path class="line" d="M250 380 C290 400 315 400 350 400"/>
  <path class="line" d="M250 410 C295 500 315 540 350 540"/>

  <path class="line" d="M600 260 L760 260"/>
  <rect class="labelBg" x="635" y="239" width="112" height="18"/>
  <text class="label" x="640" y="252">10.0.6.200:3000</text>

  <path class="line" d="M600 400 L760 400"/>
  <rect class="labelBg" x="635" y="379" width="112" height="18"/>
  <text class="label" x="640" y="392">10.0.6.200:8081</text>

  <path class="line" d="M600 540 L760 540"/>
  <rect class="labelBg" x="635" y="519" width="112" height="18"/>
  <text class="label" x="640" y="532">10.0.6.200:8082</text>

  <path class="line" d="M1010 260 L1055 260"/>
  <rect class="labelBg" x="1018" y="239" width="88" height="18"/>
  <text class="label" x="1023" y="252">http://app:3000</text>

  <path class="line" d="M1180 307 C1180 335 980 330 935 355"/>
  <path class="line" d="M1180 307 C1180 455 1020 465 1000 495"/>
  <path class="line" d="M1180 307 L1180 355"/>
  <path class="line" d="M1180 433 L1180 465"/>
  <path class="line" d="M1180 307 C1320 430 1320 555 1180 575"/>
  <path class="line" d="M885 495 C925 420 1018 350 1055 285"/>

  <rect class="noteGroup" x="50" y="690" width="1295" height="90" rx="12"/>
  <text class="groupTitle" x="75" y="724">Kritik Kurallar</text>
  <text class="txt" x="75" y="752">1. belgelik -> 10.0.6.200:3000, authbelgelik -> 10.0.6.200:8081, officebelgelik -> 10.0.6.200:8082</text>
  <text class="txt" x="75" y="774">2. Reverse proxy Host, X-Forwarded-Host ve X-Forwarded-Proto=https headerlarini upstream'e iletmeli.</text>
</svg>
